@if (auth.isLoggedIn()) {
  <div class="app-frame">
    <aside class="sidebar">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-mark"><mat-icon>school</mat-icon></span>
        <span>Campus<br><strong>Desk</strong></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="Main navigation">
        <a routerLink="/dashboard" routerLinkActive="active"><mat-icon>space_dashboard</mat-icon><span>Overview</span></a>
        <a routerLink="/students" routerLinkActive="active"><mat-icon>groups</mat-icon><span>Students</span></a>
        <a routerLink="/students/new" routerLinkActive="active"><mat-icon>person_add</mat-icon><span>Add student</span></a>
        <a routerLink="/about" routerLinkActive="active"><mat-icon>info</mat-icon><span>About</span></a>
      </nav>
      <div class="sidebar-bottom"><span class="online-dot"></span> Demo workspace</div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="breadcrumb">STUDENT MANAGEMENT <span>/</span> ADMIN</div>
        <button class="profile-button" type="button" (click)="logout()" aria-label="Log out">
          <span class="avatar-mini">AD</span><span class="profile-name">Admin<small>Administrator</small></span><mat-icon>logout</mat-icon>
        </button>
      </header>
      <main class="page-content"><router-outlet /></main>
    </section>
  </div>
} @else {
  <router-outlet />
}
